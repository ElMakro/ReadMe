name: Build and push Docker Images

on:
    workflow_call:
        inputs:
            ref:
                description: 'Целевая метка репозитория для сборки (тег, название ветки) (по умолчанию - main)'
                required: false
                type: string
                default: 'main'

            tags:
                description: 'Теги образа'
                required: true
                type: string

            services:
                description: 'Список сервисов для сборки'
                required: false
                type: string
                default: '["readme-server","readme-client","readme-database-manager"]'

jobs:
    build-images:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                include:
                    -   service: readme-server
                        context: ./server
                        dockerfile: ./server/Dockerfile
                    -   service: readme-client
                        context: ./client
                        dockerfile: ./client/Dockerfile
                    -   service: readme-database-manager
                        context: .
                        dockerfile: ./database_manager/Dockerfile

        steps:
            -   name: Check if this service should be built
                id: check
                run: |
                    SERVICES='${{ inputs.services }}'
                    SERVICE='${{ matrix.service }}'
                    if echo "$SERVICES" | grep -q "\"$SERVICE\""; then
                      echo "build=true" >> $GITHUB_OUTPUT
                    else
                      echo "build=false" >> $GITHUB_OUTPUT
                    fi

            -   name: Checkout repository
                if: steps.check.outputs.build == 'true'
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.ref }}

            -   name: Set up Docker Buildx
                if: steps.check.outputs.build == 'true'
                uses: docker/setup-buildx-action@v4

            -   name: Log in to Docker Hub
                if: steps.check.outputs.build == 'true'
                uses: docker/login-action@v4
                with:
                    username: ${{ vars.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: Build and push Docker image
                if: steps.check.outputs.build == 'true'
                uses: docker/build-push-action@v7
                with:
                    context: ${{ matrix.context }}
                    file: ${{ matrix.dockerfile }}
                    push: true
                    tags: |
                        ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ inputs.tags }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
                    sbom: true
                    provenance: mode=max