name: Lint, test and check coverage

on:
    push:

jobs:
    combined-check:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Set up Python 3.13.13
                uses: actions/setup-python@v6
                with:
                    python-version: '3.13.13'

            -   name: Install dependencies
                run: |
                    pip install -r requirements.txt
                    pip install -r server/requirements.txt
                    pip install -r client/requirements.txt

            -   name: Lint with Ruff
                run: |
                    ruff check

            -   name: Run all tests with combined coverage
                run: |
                    pytest server/tests/ client/tests/ \
                      -c pytest.ini \
                      --cov=server \
                      --cov=client \
                      --cov=database_manager \
                      --cov-report=html:reports/combined/coverage \
                      --cov-fail-under=60 \
                      --junitxml=reports/combined/test-results.xml

            -   name: Upload combined reports
                uses: actions/upload-artifact@v6
                with:
                    name: combined-reports
                    path: reports/combined/