name: Build and push Docker Images on release

on:
    release:
        types: [ published ]

jobs:
    call-build-images-release-tagged:
        uses: ./.github/workflows/_build_and_push_images.yml
        secrets: inherit
        with:
            tags: ${{ github.event.release.tag_name }}

    call-build-images-latest-tagged:
        uses: ./.github/workflows/_build_and_push_images.yml
        secrets: inherit
        with:
            tags: latest