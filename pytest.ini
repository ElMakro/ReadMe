[pytest]
testpaths = server/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

pythonpath = .

addopts =
    -v
    --strict-markers
    --cov-config=.coveragerc
    --cov-report=term
    --cache-clear

markers =
    unit: Unit tests
    integration: Integration tests

env =
    DB_NAME=readmedb
    DB_USER=readmepguser
    DB_PASSWORD=password123
    DB_HOST=localhost
    DB_PORT=5432
    DB_ECHO=False
    REDIS_HOST=localhost
    REDIS_PORT=6379
    REDIS_DB=0
    REDIS_PASSWORD=pass123
    SERVER_HOST=localhost
    SERVER_PORT=8080
    CLIENT_HOST=localhost
    CLIENT_PORT=8000
    TOKEN_EXPIRE=3600
    SECRET_KEY=secretkey
    SECRET_LINK_KEY=jOlDKyBBqp8okb9sS-E6FzTXyTv0viu3aessVKSdLSU=
    DEFAULT_SECRET_APPLICATION_LINK_PART=submit_professor_application
    DEFAULT_ADMIN_NICKNAME=admin
    DEFAULT_ADMIN_EMAIL=admin@mail.com
    DEFAULT_ADMIN_PASSWORD=12345678
    BACKUP_VOLUMES=readme-courses-resources,readme-users-resources
    BACKUP_ENABLED=true
    BACKUP_INTERVAL_HOURS=2
    BACKUP_KEEP_DAYS=2