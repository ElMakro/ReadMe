{% extends "base.html" %}

{% block title %}Мои заявки на преподавание{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="section-title mb-4">Мои заявки на преподавание</h1>

    <div id="applicationsList" class="row g-4">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-accent" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
        </div>
    </div>

    <!-- Пагинация -->
    <div class="pagination d-flex justify-content-center gap-3 flex-wrap align-items-center mt-4">
        <button class="pagination-btn" id="prevPageBtn">
            <span>←</span> Предыдущий
        </button>
        <button class="pagination-btn" id="nextPageBtn">
            Следующий <span>→</span>
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='my_applications.js') }}"></script>
{% endblock %}
