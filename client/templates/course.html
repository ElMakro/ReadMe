{% extends "base.html" %}
{% block title %}Курс — ReadMe{% endblock %}

{% block content %}
<div class="container-fluid h-100">
    <div class="row h-100">
        <!-- Левая боковая панель -->
        <nav class="col-md-3 col-lg-2 course-sidebar" id="courseSidebar">
            <div class="py-4 px-3">
                <h5 class="mb-3" id="courseTitleHeader">Загрузка...</h5>
                <ul class="list-group list-group-flush" id="sectionList"></ul>
            </div>
        </nav>

        <!-- Основной контент -->
        <article class="col-md-9 col-lg-10 main-content" id="mainContent">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-sm btn-outline-accent" id="toggleSidebarBtn" title="Скрыть меню">◀</button>
                    <h2 id="courseNameMain" class="mb-0"></h2>
                </div>
                <button id="enrollBtn" class="btn btn-accent" style="display: none;">Записаться</button>
            </div>
            <div id="topicContent" class="topic-content"></div>
        </article>
    </div>
</div>

<!-- Плавающее окно и кнопка -->
<div id="floatingWindow" class="floating-window" style="display: none;">
    <div id="windowHeader" class="window-header">
        <span>Конспект</span>
        <div style="display: flex; gap: 8px;">
            <button id="deleteConspectBtn" class="btn-close-window">Удалить</button>
            <button id="saveConspectBtn" class="btn-save-conspect">Сохранить</button>
            <button id="closeWindowBtn" class="btn-close-window">✕</button>
        </div>
    </div>
    <textarea class="conspect-content" placeholder="Напишите здесь свои мысли..."></textarea>
</div>

<div id="floatingTabButton" class="floating-tab-button">📌</div>
{% endblock %}

{% block scripts %}
<script>
    window.COURSE_ID = "{{ course_id }}";
    window.API_BASE_URL = "{{ api_base_url }}";
</script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js"></script>

<script src="/static/course_creation/breadcrumbs_manager.js"></script>
<script src="/static/notes.js"></script>
<script src="/static/course.js"></script>
{% endblock %}
