{% extends "base.html" %}

{% block title %}Управление заявками на преподавание{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="section-title">Активные заявки на преподавание</h1>
        <div>
            <button class="btn btn-outline-accent" id="manageSecretLinkBtn">Управление ссылкой</button>
            <button class="btn btn-outline-accent ms-2" id="refreshBtn">Обновить</button>
        </div>
    </div>

    <div id="applicationsList" class="row g-4">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-accent" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
        </div>
    </div>

    <!-- Пагинация -->
    <div id="paginationContainer" class="mt-4"></div>
</div>

<!-- Модальное окно для изменения статуса -->
<div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="statusModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content" style="background: var(--bg-secondary); border: var(--border-width) solid var(--border-color);">
            <div class="modal-header">
                <h5 class="modal-title" id="statusModalLabel">Изменение статуса заявки</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <p>Вы собираетесь <strong id="actionText"></strong> заявку пользователя <strong id="userFullName"></strong>.</p>
                <div class="mb-3">
                    <label for="adminComment" class="form-label">Комментарий (необязательно)</label>
                    <textarea class="form-control" id="adminComment" rows="3" style="background: var(--bg-primary); border-color: var(--border-color); color: var(--text-primary);"></textarea>
                </div>
                <input type="hidden" id="currentApplicationId">
                <input type="hidden" id="currentUserId">
                <input type="hidden" id="currentNewStatus">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-accent" id="confirmStatusBtn">Подтвердить</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>window.API_BASE_URL = "{{ api_base_url }}";</script>
<script src="/static/admin/admin_applications.js"></script>
{% endblock %}
