{% extends "base.html" %}
{% block title %}Управление записью на курсы{% endblock %}

{% block content %}
<div class="container-xl py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active">Все курсы</li>
        </ol>
    </nav>
    <div class="card bg-secondary border-0 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Выберите курс для управления пользователями</h5>
            <div id="coursesList" class="mb-4"></div>
            <div class="pagination d-flex justify-content-center gap-2 mt-3">
                <button class="btn btn-outline-secondary" id="prevPageBtn">← Пред.</button>
                <span id="pageInfo" class="mx-3 align-self-center"></span>
                <button class="btn btn-outline-secondary" id="nextPageBtn">След. →</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.API_BASE_URL = "{{ api_base_url }}";
</script>
<script src="/static/admin/courses.js"></script>
{% endblock %}
