{% extends "base.html" %}
{% block title %}Мои созданные курсы — ReadMe{% endblock %}

{% block content %}
<div class="container-xl py-4">
    <div class="card bg-secondary border-0 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-4">Мастерская курсов</h5>
            <div id="createdCoursesList" class="list-group mb-4">
                <!-- сюда будут загружены курсы -->
                <div class="text-muted">Загрузка...</div>
            </div>
            <div class="mt-3">
                <a href="/create-course" class="btn btn-accent w-100" style="background: var(--accent);">
                    + Создать курс
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>window.API_BASE_URL = "{{ api_base_url }}";</script>
<script src="../static/created_courses.js"></script>
{% endblock %}
