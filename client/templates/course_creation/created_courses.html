{# templates/course_creation/created_courses.html #}
{% extends "base.html" %}
{% block title %}Мастерская курсов — ReadMe{% endblock %}

{% block content %}
<div class="container-xl py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active">Мастерская курсов</li>
        </ol>
    </nav>

    <div class="card bg-secondary border-0 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Мои курсы</h5>
            <div id="coursesList" class="mb-4">
                <!-- сюда динамически загружаются курсы -->
            </div>
            <button class="btn btn-outline-accent" id="addCourseBtn">+ Добавить курс</button>
        </div>
    </div>
    <!-- Контейнер для пагинации -->
    <div id="paginationContainer" class="mt-4"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.API_BASE_URL = "{{ api_base_url }}";
</script>
<script src="/static/course_creation/breadcrumbs_manager.js"></script>
<script src="/static/course_creation/tag_manager.js"></script>
<script src="/static/course_creation/created_courses.js"></script>
{% endblock %}
