{# templates/course_creation/edit_blocks.html #}
{% extends "base.html" %}
{% block title %}Редактирование блоков — ReadMe{% endblock %}

{% block content %}
<div class="container-xl py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/created-courses">Мастерская курсов</a></li>
            <li class="breadcrumb-item" id="courseTitleBreadcrumb"><a href="/course/{{ course_id }}/sections">Загрузка...</a></li>
            <li class="breadcrumb-item" id="sectionTitleBreadcrumb"><a href="/course/{{ course_id }}/section/{{ section_id }}/topics">Загрузка...</a></li>
            <li class="breadcrumb-item active" id="topicTitleBreadcrumb">Загрузка...</li>
        </ol>
    </nav>

    <div class="card bg-secondary border-0 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Блоки темы</h5>
            <div id="blocksList" class="mb-4">
                <!-- Список блоков -->
            </div>
            <button class="btn btn-outline-accent mb-4" id="addBlockBtn">+ Добавить блок</button>
            <div class="d-flex justify-content-between">
                <a href="/course/{{ course_id }}/section/{{ section_id }}/topics" class="btn btn-outline-secondary">Назад</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.COURSE_ID = "{{ course_id }}";
    window.SECTION_ID = "{{ section_id }}";
    window.TOPIC_ID = "{{ topic_id }}";
    window.API_BASE_URL = "{{ api_base_url }}";
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js"></script>
<script>
    // Инициализация Mermaid (не запускать автоматически)
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

    // Дожидаемся загрузки MathJax
    window.MathJax = {
        startup: {
            ready: () => {
                console.log('MathJax ready');
                window.MathJax.startup.defaultReady();
            }
        },
        options: {
            // Отключаем автоматический рендеринг на странице редактирования
            ignoreHtmlClass: 'no-mathjax'
        }
    };
</script>

<script src="/static/course_creation/breadcrumbs_manager.js"></script>
<script src="/static/course_creation/blocks.js"></script>
{% endblock %}
