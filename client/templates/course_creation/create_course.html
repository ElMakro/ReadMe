{# templates/create_course.html #}
{% extends "base.html" %}
{% block title %}Создание курса — ReadMe{% endblock %}

{% block content %}
<div class="container-xl py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active">Курс</li>
        </ol>
    </nav>

    <div class="card bg-secondary border-0 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Название курса</h5>
            <input type="text" class="form-control mb-4" id="courseTitle" placeholder="Введите название курса" required>

            <div class="mb-4">
                <label for="courseDescription" class="form-label">Описание курса</label>
                <textarea class="form-control" id="courseDescription" rows="3"
                          placeholder="Введите описание курса (необязательно)"
                          style="width: 100%; resize: vertical; min-height: 80px;"></textarea>
                <small class="text-muted">Кратко о том, чему научится студент</small>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/created-courses" class="btn btn-outline-secondary" id="backBtn">Назад</a>
                <button class="btn btn-accent" id="saveCourseBtn">Сохранить и продолжить</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>window.API_BASE_URL = "{{ api_base_url }}";</script>
<script src="../../static/course_creation/create_course.js"></script>
{% endblock %}
