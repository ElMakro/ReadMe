{% extends "base.html" %}
{% block title %}Мои заметки — ReadMe{% endblock %}

{% block content %}
<div class="container-xl py-4">
    <div class="card bg-secondary border-0 shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-4">Мои конспекты</h5>
            <div id="notesList" class="list-group">
                <div class="text-muted text-center py-4">Загрузка...</div>
            </div>
            <div class="pagination d-flex justify-content-center gap-2 mt-4" id="notesPagination" style="display: none;">
                <button class="btn btn-outline-secondary" id="prevNotesPage">← Пред.</button>
                <span id="notesPageInfo" class="mx-3 align-self-center"></span>
                <button class="btn btn-outline-secondary" id="nextNotesPage">След. →</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>window.API_BASE_URL = "{{ api_base_url }}";</script>
<script src="/static/notes.js"></script>
{% endblock %}
