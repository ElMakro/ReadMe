{# templates/profile.html #}
{% extends "base.html" %}
{% block title %}Профиль — ReadMe{% endblock %}

{% block content %}
<div class="container-xl py-5">
    <div id="profileContainer">
        <!-- Будет заполнено через JS -->
        <div class="text-center">Загрузка профиля...</div>
    </div>

    <!-- Достижения (можно тоже через JS или оставить статикой) -->
    <h3 class="mb-4 mt-5">Мои Достижения</h3>
    <div class="row row-cols-1 row-cols-md-3 g-3 mb-4" id="achievementsContainer">
        <!-- сюда можно подгрузить достижения, пока пусто -->
    </div>
    <a href="/achievements" class="btn btn-outline-accent">Все Достижения →</a>
</div>
{% endblock %}

{% block scripts %}
<script>window.API_BASE_URL = "{{ api_base_url }}";</script>
<script src="../static/auth.js"></script>
<script src="../static/profile.js"></script>
{% endblock %}
