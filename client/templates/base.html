<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReadMe{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>

    <header class="header">
        <div class="container-fluid container-xl d-flex flex-wrap align-items-center justify-content-between py-3">
            <div class="logo"><a href="/"> ReadMe </a></div>
            <div class="search-box position-relative">
                <input type="text" placeholder="Поиск:" id="searchInput">
            </div>
            <div class="header-buttons d-flex gap-3">
                <button class="btn-login" id="myNotesBtn" style="display: none;">Конспекты</button>
                <button class="theme-toggle" id="themeToggle">
                    <span id="themeText">Тьма</span>
                </button>
                <button class="btn-login" id="loginBtn">Вход</button>
                <button class="btn-login" id="profileBtn" style="display: none;">Профиль</button>
            </div>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container-xl">
            <div class="row text-center text-md-start gy-4">
                <div class="col-md-4">
                    <h4>ReadMe</h4>
                    <p class="small text-secondary mb-0">Образовательная платформа для публикации и изучения курсов.</p>
                    <div class="mt-3">
                        <span class="badge bg-warning text-dark">Сервис находится в разработке</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <h4>Контакты</h4>
                    <ul class="list-unstyled">
                        <li><a href="mailto:readme.ivt.yarsu@mail.ru">readme.ivt.yarsu@mail.ru</a></li>
                    </ul>
                </div>
                <div class="col-md-4">
                    <h4>О проекте</h4>
                    <ul class="list-unstyled">
                        <li><a href="/policy">Политика конфиденциальности</a></li>
                    </ul>
                </div>
            </div>
            <hr class="my-3 border-secondary">
            <div class="text-center text-secondary small">
                &copy 2026 ReadMe
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.API_BASE_URL = "{{ api_base_url }}";</script>
    <script src="{{ url_for('static', path='access-denied.js') }}"></script>
    <script src="{{ url_for('static', path='auth.js') }}"></script>
    <script src="{{ url_for('static', path='auth-modal.js') }}"></script>
    <script src="{{ url_for('static', path='header.js') }}"></script>
    <script src="{{ url_for('static', path='toast.js') }}"></script>
    <script src="{{ url_for('static', path='cookie.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
