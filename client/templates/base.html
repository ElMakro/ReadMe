<!--{# templates/base.html #}-->
<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReadMe{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <header class="header">
        <div class="container-fluid container-xl d-flex flex-wrap align-items-center justify-content-between py-3">
            <div class="logo"><a href="/"> ReadMe </a></div>
            <div class="search-box position-relative">
                <input type="text" placeholder="Поиск:" id="searchInput">
                <span class="search-icon">🔍</span>
            </div>
            <div class="header-buttons d-flex gap-3">
                <button class="theme-toggle" id="themeToggle">
                    <span id="themeText">Тьма</span>
                </button>
                <button class="btn-login" id="loginBtn">Вход</button>
                <button class="btn-login" id="profileBtn" style="display: none;">Профиль</button>
            </div>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container-xl">
            <div class="row text-center text-md-start">
                <div class="col-md-6 mb-4 mb-md-0">
                    <h4>ReadMe</h4>
                    <a href="#">Иконки</a>
                </div>
                <div class="col-md-6">
                    <h4>О Нас</h4>
                    <a href="#">Контактная Инфо</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.API_BASE_URL = "{{ api_base_url }}";</script>
    <script src="../static/auth.js"></script>
    <script src="../static/auth-modal.js"></script>
    <script src="../static/header.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
